<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f6b">
<title>Offline · Expense Tracker</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f9f8; --card:#fff; --ink:#1c2925; --muted:#64716b; --line:#e1e7e3; --brand:#087f6b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#07100b; --card:#101a15; --ink:#edf2ef; --muted:#a2afa8; --line:#29342e; --brand:#5bc4a8; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
    font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .mark { width:36px; height:36px; border-radius:10px; background:var(--brand); display:grid; place-items:center; color:#fff; margin-bottom:16px; }
  h1 { font-size:20px; letter-spacing:-0.02em; margin:0 0 6px; }
  p { margin:0 0 12px; color:var(--muted); }
  button { margin-top:8px; min-height:44px; width:100%; border:0; border-radius:10px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1>You’re offline</h1>
  <p>Your balances are only shown when they can be checked with the server, so this page can’t load right now.</p>
  <p>If the app was already open, entries you add there are kept on this device and sync when you reconnect.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
